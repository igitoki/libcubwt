name: Windows-CUDA-Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022 # Tam uyumlu VS 2022 ve kararlı CUDA 12 ortamı
    steps:
      - uses: actions/checkout@v4

      # Bulut bilgisayarında zaten yüklü gelen hazır CUDA'yı doğrudan aktif ediyoruz
      - name: Configure Local CUDA
        run: |
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.2\bin" >> $GITHUB_PATH
          echo "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.2" >> $GITHUB_ENV
        shell: bash

      # Saniyeler içinde derleme
      - name: Build DLL
        run: |
          nvcc -O3 --shared -arch=sm_89 libcubwt.cu -o libcubwt.dll

      # Üretilen DLL dosyasını indirme paketi haline getirme
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcubwt-rtx4050-windows
          path: libcubwt.dll

name: Windows-CUDA-Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # NVIDIA'nın devasa paketini internetten indirmek yerine, GitHub'ın kendi içinde kurulu gelen hazır CUDA'yı bağlıyoruz!
      - name: Configure Local CUDA
        run: |
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.2\bin" >> $GITHUB_PATH
          echo "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.2" >> $GITHUB_ENV
        shell: bash

      - name: Build DLL
        run: |
          nvcc -O3 --shared -arch=sm_89 libcubwt.cu -o libcubwt.dll

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcubwt-rtx4050-windows
          path: libcubwt.dll
